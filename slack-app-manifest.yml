display_information:
  name: SEO承認ボット
  description: 週次SEO提案をSlackのリアクションで承認します
  background_color: "#0f766e"

features:
  bot_user:
    display_name: SEO承認ボット
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - reactions:read

settings:
  event_subscriptions:
    request_url: https://tsuyoshishirota.com/api/slack-events
    bot_events:
      - reaction_added
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
